<!DOCTYPE html> 
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Yarn Stash</title>

        <!--Font link-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

        <!--Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!--Links to JS and CSS-->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="script.js" defer></script> 
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <div class="container-fluid d-flex flex-column min-vh-100">
            <h1>Yarn Stash</h1>

            <div class="row flex-grow-1">
                <aside class="col-12 col-md-auto d-flex flex-column gap-2 pe-0 sidebar">
                    <button class="sidebarBtn" id="all-button">All Inventory</button>
                    <button class="sidebarBtn" id="favs">Favorites</button>
                    <button class="sidebarBtn" id="in-stock">In Stock</button>
                    <button class="sidebarBtn" id="out-of-stock">Out of Stock</button>
                </aside>

                <main class="col-12 col-md main">
                    <!--Search section-->
                    <div class="container-fuild d-flex flex-row">
                        <search class="col-12 col-md">
                            <!--Add event lisenter for keystroke-->
                            <form id="search-bar" action="#">
                                <div class="position-relative">
                                    <input 
                                        type="search" 
                                        id="yarn-search"
                                        name="q"
                                        class="form-control"
                                        placeholder="Search by brand, color, weight..."
                                        aria-label="Searching through site content"
                                    >

                                    <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-3 text-secondary search-icon"></i>
                                    
                                </div>
                            </form>
                        </search>

                        <!--Add yarn button-->
                        <button class="row-12 row-md" id="addYarn" data-bs-toggle="modal" data-bs-target="#addYarnModal" >Add Yarn</button> 
                    </div>    

                    <!--Add cards here when you create a new entry-->
                    <div class="col-12 col-md-4 yarn-cards">
                        <!--Example card for testing-->
                        <div class="yarn-card">
                            <div class="color-box">
                                <!--just holds the color picked in the background color-->
                            </div>
                            <div class="yarn-attributes">
                                <ul class="list-unstyled row row-cols-2 g-2 mb-0">
                                    <li class="col">Brand:</li>
                                    <li class="col">Color:</li>
                                    <li class="col">Weight:</li>
                                    <li class="col">Skiens:</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    
                </main>

                <div class="modal fade" id="addYarnModal" tabindex="-1" role="addYarn">
                    <div class="modal-dialog modal-dialog-centered" role="addYarn">
                        <div class="modal-content custom-addYarn-modal">
                            <div class="modal-header">
                                <h5 class="modal-title">Add Yarn</h5>
                                <button type="button" class="ms-auto me-0 close" data-dismiss="modal" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                            <div class="modal-body">
                                <div id="color-picker-container">
                                    <input id="color-picker" type="color">
                                </div>
                                <div class="yarn-attrs">
                                    <label for="brands-input">Brand:</label>
                                    <input id="brands-input" type="text" name="brands" placeholder="Type the brand name">

                                    <label for="color-input">Color Name:</label>
                                    <input id="color-input" type="text" name="colors" placeholder="Type the color name">

                                    <div class="dropdown weight">
                                        <button class="dropdown-toggle" type="button" id="weight-drop-down" data-bs-toggle="dropdown">
                                            Select a weight
                                        </button>
                                        <div class="dropdown-menu">
                                            <li class="dropdown-item">1-Superfine</li>
                                            <li class="dropdown-item">2-Fine</li>
                                            <li class="dropdown-item">3-Light</li>
                                            <li class="dropdown-item">4-Medium</li>
                                            <li class="dropdown-item">5-Bulky</li>
                                            <li class="dropdown-item">6-Super Bulky</li>
                                            <li class="dropdown-item">7-Jumbo</li>
                                        </div>
                                    </div>

                                   

                                    <input id="skiens" type="number" name="skiens" min="1"s placeholder="Number of skiens">


                                </div>

                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-primary">Save changes</button>
                                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>

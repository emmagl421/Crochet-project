<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sign up · Yarn Stash</title>

        <!--Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito+Sans:opsz,wght@6..12,400..800&display=swap" rel="stylesheet">

        <!--Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!--Links to JS and CSS-->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="auth-page">
        <header class="topbar">
            <a href="index.html" class="wordmark-link">
                <h1 class="wordmark">Yarn Stash</h1>
            </a>
        </header>

        <main class="auth-main">
            <section class="auth-card" aria-labelledby="signup-title">
                <!--Decorative yarn strip, same texture as the card swatches-->
                <div class="auth-strip" aria-hidden="true">
                    <span style="background-color: #C98B95;"></span>
                    <span style="background-color: #9DB59A;"></span>
                    <span style="background-color: #E9A93B;"></span>
                    <span style="background-color: #7D80DA;"></span>
                    <span style="background-color: #6B2D5C;"></span>
                </div>

                <div class="auth-body">
                    <h2 class="auth-title" id="signup-title">Create your account</h2>
                    <p class="auth-lede">Keep track of every skein you own, from anywhere.</p>

                    <!--Error / success message: set text and remove "d-none" in JS-->
                    <div id="signup-message" class="auth-message d-none" role="alert"></div>

                    <form id="signup-form" class="auth-form" action="#" novalidate>
                        <div class="field">
                            <label for="signup-name">Name</label>
                            <input id="signup-name" class="ys-input" type="text" name="name" autocomplete="name" placeholder="What should we call you?">
                        </div>

                        <div class="field">
                            <label for="signup-email">Email</label>
                            <input id="signup-email" class="ys-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                            <small class="field-error"></small> 
                        </div>

                        <div class="field">
                            <label for="signup-password">Password</label>
                            <div class="input-with-btn">
                                <input id="signup-password" class="ys-input" type="password" name="password" autocomplete="new-password" placeholder="Create a password" minlength="8" required aria-describedby="password-hint">
                                <button type="button" class="toggle-visibility" id="toggle-password" aria-label="Show password">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <small id="password-hint" class="field-hint">Use 8 or more characters.</small>
                            <small class="field-error"></small> 
                        </div>

                        <div class="field">
                            <label for="signup-confirm">Confirm password</label>
                            <input id="signup-confirm" class="ys-input" type="password" name="confirm" autocomplete="new-password" placeholder="Type it again" required>
                            <small class="field-error"></small> 
                        </div>

                        <button type="submit" id="signup-btn" class="btn-primary-ys w-100">Create account</button>
                    </form>

                    <p class="signup-row">
                        Already have an account?
                        <a href="login.html" class="link-btn" id="back-to-login">Log in</a>
                    </p>
                </div>
            </section>
        </main>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Log in · Yarn Stash</title>

        <!--Fonts-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..700,100&family=Nunito+Sans:opsz,wght@6..12,400..800&display=swap" rel="stylesheet">

        <!--Bootstrap-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <!--Links to JS and CSS-->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="auth-page">
        <header class="topbar">
            <a href="index.html" class="wordmark-link">
                <h1 class="wordmark">Yarn Stash</h1>
            </a>
        </header>

        <main class="auth-main">
            <section class="auth-card" aria-labelledby="login-title">
                <!--Decorative yarn strip, same texture as the card swatches-->
                <div class="auth-strip" aria-hidden="true">
                    <span style="background-color: #7D80DA;"></span>
                    <span style="background-color: #C98B95;"></span>
                    <span style="background-color: #6B2D5C;"></span>
                    <span style="background-color: #9DB59A;"></span>
                    <span style="background-color: #E9A93B;"></span>
                </div>

                <div class="auth-body">
                    <h2 class="auth-title" id="login-title">Welcome back</h2>
                    <p class="auth-lede">Log in to see your stash.</p>

                    <!--Error / success message: set text and remove "d-none" in JS-->
                    <div id="login-message" class="auth-message d-none" role="alert"></div>

                    <form id="login-form" class="auth-form" action="#" novalidate>
                        <div class="field">
                            <label for="login-email">Email</label>
                            <input id="login-email" class="ys-input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
                            <small class="field-error"></small> 
                        </div>

                        <div class="field">
                            <div class="label-row">
                                <label for="login-password">Password</label>
                                <a href="#" class="link-btn" id="forgot-password">Forgot password?</a>
                            </div>
                            <div class="input-with-btn">
                                <input id="login-password" class="ys-input" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" required>
                                <button type="button" class="toggle-visibility" id="toggle-login-password" aria-label="Show password">
                                    <i class="bi bi-eye" aria-hidden="true"></i>
                                </button>
                            </div>
                            <small class="field-error"></small> 
                        </div>

                        <button type="submit" id="login-btn" class="btn-primary-ys w-100">Log in</button>
                    </form>

                    <p class="signup-row">
                        New here?
                        <a href="signup.html" class="link-btn" id="go-to-signup">Create an account</a>
                    </p>
                </div>
            </section>
        </main>
    </body>
</html>
